name: Deploy to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality checks
        run: pnpm quality:check

      - name: Audit production dependencies
        run: pnpm security:check

      - name: Build app
        run: pnpm build

  deploy:
    needs: verify
    if: needs.verify.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # The schema is applied by hand with `pnpm db:push`, so nothing otherwise
      # stops a deploy whose code needs a column or enum value production does
      # not have yet. That failure is invisible until a player hits it: Map mode
      # shipped working and stayed broken in production for want of one enum
      # value. This compares the committed schema against the live database and
      # stops the deploy while the two disagree. It only ever reads.
      - name: Check production schema drift
        run: |
          ENV_FILE=.vercel/.env.production.local
          if [ ! -f "$ENV_FILE" ]; then
            echo "::error::$ENV_FILE not found; 'vercel pull' did not write the production env."
            ls -a .vercel || true
            exit 1
          fi
          set -a
          . "$ENV_FILE"
          set +a
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL missing from the pulled production env."
            exit 1
          fi
          if pnpm dlx prisma@6.19.3 migrate diff \
              --from-url "$DATABASE_URL" \
              --to-schema-datamodel prisma/schema.prisma \
              --exit-code --script; then
            echo "Production schema matches prisma/schema.prisma."
          else
            echo "::error::Production database is behind prisma/schema.prisma. The SQL above is what it is missing. Apply it with 'pnpm db:push' before deploying."
            exit 1
          fi

      - name: Build project artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy prebuilt output to production
        run: vercel deploy --prebuilt --archive=tgz --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
